name: Desktop CLI
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: macos-arm64 }
          - { os: macos-15-intel, platform: macos-x64 }
          - { os: windows-2022, platform: windows-x64 }
          - { os: windows-11-arm, platform: windows-arm64 }
          - { os: ubuntu-22.04-arm, platform: linux-arm64 }
          - { os: ubuntu-22.04, platform: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native-core build tools on Windows ARM
        if: matrix.platform == 'windows-arm64'
        uses: msys2/setup-msys2@v2
        with:
          install: make
          update: false
          release: true
      - name: Install Zig for Windows ARM SNES source builds
        if: matrix.platform == 'windows-arm64'
        uses: mlugg/setup-zig@v2
        with:
          version: '0.15.2'
      - name: Expose GNU make to the desktop CLI
        if: matrix.platform == 'windows-arm64'
        shell: msys2 {0}
        run: cygpath -w /usr/bin >> "$GITHUB_PATH"
      - run: python -m pip install .
      - name: Test calculations and publication
        run: python -m unittest discover -s tests
      - name: Exercise score API, pagination, matching and ranking
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          python site/build.py "$RUNNER_TEMP/worker.mjs"
          node --experimental-sqlite tests/test_service.mjs "$RUNNER_TEMP/worker.mjs"
      - name: Install the reference mGBA release
        run: python -m emubench install mgba --version 0.10.5
      - name: Package native CLI
        run: |
          python -m pip install pyinstaller==6.16.0
          python tools/package_cli.py
      - name: Verify offline automatic uploads and local ROM paths in the packaged CLI
        run: python -c "from emubench import engines; import os,subprocess,sys; subprocess.run([sys.executable,'tests/cli_upload_smoke.py','dist/emubench'+('.exe' if os.name=='nt' else ''),engines.install(engines.REFERENCE)[0]],check=True)"
      - name: Measure original generated workload and inspect public result
        shell: bash
        run: |
          ./dist/emubench install mgba --version latest
          python tests/workload.py "$RUNNER_TEMP/sample.gba"
          ./dist/emubench run --version 0.10.5 --rom "$RUNNER_TEMP/sample.gba" --warmup-frames 30 --frames 300 --out "$RUNNER_TEMP/score.json"
          ./dist/emubench publish "$RUNNER_TEMP/score.json" --game "CI smoke workload" --preview
          ./dist/emubench details "$RUNNER_TEMP/score.json" --out "$RUNNER_TEMP/chart.html"
          ./dist/emubench campaign create "$RUNNER_TEMP/test.sqlite" --rom "$RUNNER_TEMP/sample.gba" --frames 100 --dedicated
          ./dist/emubench campaign resume "$RUNNER_TEMP/test.sqlite"
          ./dist/emubench campaign resume "$RUNNER_TEMP/test.sqlite"
          ./dist/emubench campaign export "$RUNNER_TEMP/test.sqlite" --job 1 --out "$RUNNER_TEMP/campaign.json"
          ./dist/emubench history --game sample
          python -c "import pathlib,os,json; root=pathlib.Path(os.environ['RUNNER_TEMP']); data=json.loads((root/'campaign.json').read_text()); assert data['rendered_frames']==100*data['window']['loops'] and data['finished_utc'] and data['sampled_frame_changes']>0; assert 'worst_at_ms' in (root/'chart.html').read_text(encoding='utf-8')"
      - name: Validate native identity and public Circuit playback
        shell: bash
        run: |
          python -c "from emubench.catalog import host_target; assert host_target() == '${{ matrix.platform }}', host_target()"
          ./dist/emubench suite --emulator mgba --version 0.10.5 --out-dir "$RUNNER_TEMP/circuit"
      - name: Download the complete emulator catalog on this host
        if: matrix.platform != 'windows-arm64' && matrix.platform != 'linux-arm64' 
        shell: bash
        run: |
          ./dist/emubench download --all
          ./dist/emubench run --latest-core --rom "$RUNNER_TEMP/sample.gba" --frames 120 --out "$RUNNER_TEMP/downloaded-core.json"
          python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'downloaded-core.json').read_text()); assert r['rendered_frames']==120*r['window']['loops'] and r['sampled_frame_changes']>0"
      - name: Verify full-frame motion polarity and public homebrew downloads
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          python -c "import subprocess,sys; from emubench import engines; subprocess.run([sys.executable,'tests/frame_motion.py',engines.install(engines.REFERENCE)[0]],check=True)"
          python tests/public_asset.py
      - name: Verify macOS source fallback on the native architecture
        if: startsWith(matrix.platform, 'macos-')
        run: python -c "from emubench import catalog,snes_build; import subprocess; core,meta=snes_build.install('bsnes',target=catalog.host_target()); subprocess.run(['./dist/emubench','suite','--emulator','bsnes','--core',str(core),'--scene','hard'],check=True)"
      - name: Measure matched SNES runs using native cores
        shell: bash
        run: |
          python tests/snes_workload.py "$RUNNER_TEMP/sample.sfc"
          for emulator in snes9x bsnes; do
            ./dist/emubench run --emulator "$emulator" --latest-core --rom "$RUNNER_TEMP/sample.sfc" --frames 300 --out "$RUNNER_TEMP/$emulator.json"
            ./dist/emubench publish "$RUNNER_TEMP/$emulator.json" --preview
            ./dist/emubench suite --emulator "$emulator" --scene hard
            python tests/chip_polarity.py "$emulator"
          done
          python -c "import json,os,pathlib; root=pathlib.Path(os.environ['RUNNER_TEMP']); a,b=[json.loads((root/(k+'.json')).read_text()) for k in ('snes9x','bsnes')]; assert all(r['rendered_frames']==300*r['window']['loops'] and r['frame_check']['changes']==r['frame_check']['samples']-1 for r in (a,b)); assert a['comparison_id']==b['comparison_id'] and a['worker_sha256']==b['worker_sha256'] and a['profile']==b['profile'] and a['core_sha256']!=b['core_sha256']"
          ./dist/emubench compare "$RUNNER_TEMP/snes9x.json" "$RUNNER_TEMP/bsnes.json" --out "$RUNNER_TEMP/comparison.html"
      - name: Verify real regional timing and signed receipts over HTTP
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          python -c "import subprocess,sys; from emubench import downloads; subprocess.run([sys.executable,'tests/region_timing.py',downloads.latest_core('snes9x')], check=True)"
          python tests/signed_receipt.py "$RUNNER_TEMP/worker.mjs" "$RUNNER_TEMP/score.json" "$RUNNER_TEMP/snes9x.json" "$RUNNER_TEMP/bsnes.json"
      - name: Scan and benchmark a mixed folder of loose and zipped cartridges
        if: matrix.platform != 'windows-arm64'
        run: python -c "import os,subprocess,sys; subprocess.run([sys.executable,'tests/cli_library_smoke.py','dist/emubench'+('.exe' if os.name=='nt' else '')],check=True)"
      - name: Check packaged score and comparison views in Chrome
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-qa" playwright-core@1.56.1 axe-core@4.10.3 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node tests/test_viewer.cjs
          NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node tests/test_score_browser.cjs "$RUNNER_TEMP/worker.mjs"
          "$RUNNER_TEMP/browser-qa/node_modules/.bin/playwright-core" install --with-deps firefox
          NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node tests/test_score_browser.cjs "$RUNNER_TEMP/worker.mjs" firefox
      - name: Read upstream diagnostic pass and fail screens from the packaged CLI
        if: matrix.platform != 'windows-arm64'
        shell: bash
        run: |
          ./dist/emubench accuracy --emulator mgba --version 0.10.5 --out "$RUNNER_TEMP/reference-checks.json" || test "$?" = 1
          python -c "import os,json,pathlib; result=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'reference-checks.json').read_text()); assert set(result['checks'])=={'ARM','Thumb','Memory'} and 'unresolved' not in result['checks'].values()"
          for emulator in mgba snes9x bsnes; do
            ./dist/emubench accuracy --emulator "$emulator" --out "$RUNNER_TEMP/$emulator-checks.json" || test "$?" = 1
          done
          python -c "import os,json,pathlib; base=pathlib.Path(os.environ['RUNNER_TEMP']); results=[json.loads((base/(key+'-checks.json')).read_text()) for key in ('mgba','snes9x','bsnes')]; assert [len(r['checks']) for r in results]==[3,2,2]; assert all(r['suite']=='cpu-memory-v1' and all(c in ('pass','fail') for c in r['checks'].values()) for r in results)"
      - name: Check the upstream Game Boy Color LCD and APU diagnostics on actual cores
        shell: bash
        run: |
          ./dist/emubench study list --console snes
          for peer in sameboy gambatte; do
            ./dist/emubench accuracy --emulator "$peer" --out "$RUNNER_TEMP/$peer-gbc.json" || test "$?" = 1
          done
          python -c "import json,os,pathlib; d=pathlib.Path(os.environ['RUNNER_TEMP']); rs=[json.loads((d/(p+'-gbc.json')).read_text())['checks'] for p in ('sameboy','gambatte')]; assert all(len(r)==8 and all(v in ('pass','fail') for v in r.values()) and all(v=='pass' for k,v in r.items() if not k.startswith('PPU mode 3')) for r in rs)"
      - name: Interrupt and resume 1001 real measurements with an offline test service
        if: matrix.platform == 'linux-x64'
        run: python tests/soak_campaign.py
      - name: Verify actual paced delivery and resumable Circuit campaigns
        shell: bash
        run: |
          ./dist/emubench suite --emulator mgba --version 0.10.5 --scene easy --paced --out-dir "$RUNNER_TEMP/paced"
          python -c "import glob,json,os; p=json.load(open(glob.glob(os.path.join(os.environ['RUNNER_TEMP'],'paced','*.json'))[0]))['paced']; assert p['frames']==600 and 0<=p['missed_deadlines']<=600 and 50<p['refresh_hz']<65"
          ./dist/emubench campaign create "$RUNNER_TEMP/circuit.sqlite" --circuit easy --emulator mgba --version 0.10.5 --dedicated
          ./dist/emubench campaign resume "$RUNNER_TEMP/circuit.sqlite"
          ./dist/emubench campaign resume "$RUNNER_TEMP/circuit.sqlite"
      - name: Exercise calibration and resume on a hosted QA runner
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          python -c "from emubench import engines; import subprocess,os,pathlib,json; core=engines.install(engines.REFERENCE)[0]; path=pathlib.Path(os.environ['RUNNER_TEMP'])/'pilot-qa.json'; cmd=['./dist/emubench','calibrate','--emulator','mgba','--dedicated','--core',str(core),'--windows','100','--blocks','5','--out',str(path)]; subprocess.run(cmd,check=True); first=path.read_bytes(); subprocess.run(cmd,check=True); assert first==path.read_bytes() and len(json.loads(first)['trials'])==10"
      - name: Assemble native release and smoke-test the cached reference
        shell: bash
        run: |
          python tools/distribute.py
          ./distribution/emubench games list
          ./distribution/emubench games install
          python -c "from emubench import games; from pathlib import Path; assert len(games.PACK['games'])==12; games.verify(Path('distribution/games'))"
          ./distribution/emubench suite --emulator mgba --scene easy
      - uses: actions/upload-artifact@v4
        with:
          name: emubench-${{ matrix.platform }}
          path: emubench-${{ matrix.platform }}.zip
