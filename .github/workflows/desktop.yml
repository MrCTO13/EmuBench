name: Desktop CLI
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: macos-arm64 }
          - { os: macos-15-intel, platform: macos-x64 }
          - { os: windows-2022, platform: windows-x64 }
          - { os: ubuntu-22.04, platform: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calculations and publication
        run: python -m unittest discover -s tests
      - name: Install the reference mGBA release
        run: python -m emubench install mgba --version 0.10.5
      - name: Package native CLI
        run: |
          python -m pip install pyinstaller==6.16.0
          python tools/package_cli.py
      - name: Measure original generated workload and inspect public result
        shell: bash
        run: |
          ./dist/emubench install mgba --version latest
          python tests/workload.py "$RUNNER_TEMP/sample.gba"
          ./dist/emubench run --version 0.10.5 --rom "$RUNNER_TEMP/sample.gba" --warmup-frames 30 --frames 300 --out "$RUNNER_TEMP/score.json"
          ./dist/emubench publish "$RUNNER_TEMP/score.json" --game "CI smoke workload" --preview
          ./dist/emubench details "$RUNNER_TEMP/score.json" --out "$RUNNER_TEMP/chart.html"
          ./dist/emubench campaign create "$RUNNER_TEMP/test.sqlite" --rom "$RUNNER_TEMP/sample.gba" --frames 100 --dedicated
          ./dist/emubench campaign resume "$RUNNER_TEMP/test.sqlite"
          ./dist/emubench campaign resume "$RUNNER_TEMP/test.sqlite"
          ./dist/emubench campaign export "$RUNNER_TEMP/test.sqlite" --job 1 --out "$RUNNER_TEMP/campaign.json"
          ./dist/emubench history --game sample
          python -c "import pathlib,os,json; root=pathlib.Path(os.environ['RUNNER_TEMP']); data=json.loads((root/'campaign.json').read_text()); assert data['rendered_frames']==100 and data['finished_utc'] and data['sampled_frame_changes']>0; assert 'worst_at_ms' in (root/'chart.html').read_text(encoding='utf-8')"
      - name: Download the complete emulator catalog on this host
        shell: bash
        run: |
          ./dist/emubench download --all
          ./dist/emubench run --latest-core --rom "$RUNNER_TEMP/sample.gba" --frames 120 --out "$RUNNER_TEMP/downloaded-core.json"
          python -c "import json,os,pathlib; r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'downloaded-core.json').read_text()); assert r['rendered_frames']==120 and r['sampled_frame_changes']>0"
      - name: Measure matched SNES runs with both prebuilt cores
        shell: bash
        run: |
          python tests/snes_workload.py "$RUNNER_TEMP/sample.sfc"
          for emulator in snes9x bsnes; do
            ./dist/emubench run --emulator "$emulator" --latest-core --rom "$RUNNER_TEMP/sample.sfc" --frames 300 --out "$RUNNER_TEMP/$emulator.json"
            ./dist/emubench publish "$RUNNER_TEMP/$emulator.json" --preview
          done
          python -c "import json,os,pathlib; root=pathlib.Path(os.environ['RUNNER_TEMP']); a,b=[json.loads((root/(k+'.json')).read_text()) for k in ('snes9x','bsnes')]; assert all(r['rendered_frames']==300 and r['sampled_frame_changes']>200 for r in (a,b)); assert a['comparison_id']==b['comparison_id'] and a['worker_sha256']==b['worker_sha256'] and a['profile']==b['profile'] and a['core_sha256']!=b['core_sha256']"
      - name: Assemble distribution
        shell: bash
        run: |
          python -c "import shutil, pathlib; dest=pathlib.Path('distribution'); dest.mkdir(); [shutil.copy2(p, dest) for p in pathlib.Path('dist').iterdir() if p.is_file()]; shutil.copytree('dist/third-party',dest/'third-party'); [shutil.copy2(p,dest) for p in ['README.md','LICENSE','THIRD-PARTY.md']]; shutil.copy2('emubench/native/libretro.h',dest/'libretro-header.h'); shutil.make_archive('emubench-${{ matrix.platform }}','zip',dest)"
      - uses: actions/upload-artifact@v4
        with:
          name: emubench-${{ matrix.platform }}
          path: emubench-${{ matrix.platform }}.zip
