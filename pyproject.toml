[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "emubench"
version = "0.7.0"
dependencies = ["cryptography>=44", "Pillow>=10", "psutil>=6"]
requires-python = ">=3.10"
description = "Measure uncapped emulator performance and conformance"
license = {file = "LICENSE"}

[project.scripts]
emubench = "emubench.cli:main"

[tool.setuptools]
packages = ["emubench"]

[tool.setuptools.package-data]
emubench = ["studies.json", "report.html", "desktop.html", "chart.js", "compare.js", "native/*.c", "native/*.h", "native/CMakeLists.txt"]
