[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "emubench"
version = "0.4.0"
requires-python = ">=3.10"
description = "Measure uncapped GBA and Super NES core performance"
license = {file = "LICENSE"}

[project.scripts]
emubench = "emubench.cli:main"

[tool.setuptools]
packages = ["emubench"]

[tool.setuptools.package-data]
emubench = ["report.html", "chart.js", "compare.js", "native/*.c", "native/*.h", "native/CMakeLists.txt"]
